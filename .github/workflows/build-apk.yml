name: Build Horizon Home APK
on:
  push:
    paths: ["launcher/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-30" >/dev/null
      - name: Build
        run: BUILD_TOOLS=34.0.0 VERSION_CODE=$((1000 + ${{ github.run_number }})) launcher/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: HorizonHome, path: launcher/build/HorizonHome.apk }
      - name: Publish as the "latest" release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TITLE="Horizon Home (Sony Bravia UR2 build)"
          NOTES="Built automatically from commit ${GITHUB_SHA::7}. Install with windows/install-horizon.bat. See SONY-UR2.md and MIGRATION-PLAN.md."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest launcher/build/HorizonHome.apk --clobber
            gh release edit latest -t "$TITLE" -n "$NOTES"
          else
            gh release create latest launcher/build/HorizonHome.apk -t "$TITLE" -n "$NOTES"
          fi
